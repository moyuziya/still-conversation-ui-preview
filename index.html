<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still — conversation interface demo</title>
<style>
:root{--paper:#f5f3ed;--ink:#222722;--forest:#194b40;--line:#ddd9d1;--muted:#6f7069;--soft:#e0e4dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Times New Roman',Georgia,serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}button:focus-visible,textarea:focus-visible{outline:3px solid #6c8c7d;outline-offset:4px}button{transition:background .18s,transform .18s}button:hover{background:#e4e7df}button:active{transform:translateY(1px)}button:disabled{cursor:default;opacity:.5}button[hidden]{display:none}.app{display:grid;grid-template-columns:20.2% minmax(0,1fr) 24.2%;height:100dvh;min-height:640px}.history{border-right:1px solid var(--line);padding:26px 26px 30px;display:flex;flex-direction:column;min-width:0}.brand{font-size:68px;color:var(--forest);letter-spacing:-4px;line-height:1.1;margin:0 8px 29px}.primary{background:var(--forest);color:white;border-radius:9px;padding:16px 18px;border:1px solid var(--forest);font-size:20px}.primary:hover{background:#2b5b4d}.new{width:100%}.history nav{border-top:1px solid var(--line);margin-top:28px;padding-top:29px}.history h2{font-size:18px;color:var(--muted);font-weight:normal;margin:0 4px 12px}.history-list{display:grid;gap:8px}.history-item{text-align:left;border-radius:5px;font-size:20px;padding:15px 14px;position:relative;line-height:1.2}.history-item[aria-current=true]{background:#e0e4db}.history-item[aria-current=true]:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--forest);border-radius:4px}.demo{margin-top:auto;padding:27px 4px 10px;border-top:1px solid var(--line);font-size:17px;color:var(--muted)}.conversation{padding:28px 34px 26px;min-width:0;display:flex;flex-direction:column;overflow:hidden}.chat-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 10px 29px}.chat-header h1{font-size:46px;font-weight:normal;margin:0;line-height:1.06}.subtitle{font-size:21px;color:var(--muted);margin:3px 0 0}.reset{font-size:19px;color:var(--forest);padding:12px 0 12px 16px;border-radius:5px}.chat-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;padding:0 3px 30px}.scene-title{font-size:clamp(36px,4.15vw,64px);font-weight:normal;color:var(--forest);text-align:center;letter-spacing:-2px;margin:116px 0 88px;line-height:1.13}.messages{display:flex;flex-direction:column;gap:28px}.message{max-width:88%;border-radius:18px;padding:20px 26px;font-size:22px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;animation:arrive .24s ease-out}.message.user{align-self:flex-end;background:#dce2d9}.message.assistant{align-self:flex-start;background:#edeae4;max-width:68%}.message.pending{font-style:italic;color:var(--muted)}.suggestions{display:flex;flex-wrap:wrap;gap:16px;margin-top:30px}.suggestions button{border:1px solid var(--forest);color:var(--forest);font-size:20px;border-radius:19px;padding:14px 25px}.composer{padding:10px 2px 0;background:var(--paper)}.composer-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fbfaf7;border-radius:16px;padding:10px 13px 10px 24px}.composer textarea{resize:none;border:0;background:transparent;min-width:0;flex:1;padding:10px 0;line-height:1.35;height:50px;max-height:110px;font-size:20px;color:var(--ink)}.composer textarea::placeholder{color:#777973}.composer .primary{padding:14px 29px}.disclosure{text-align:center;margin:17px 0 24px;font-size:14px;color:var(--muted)}.companion{border-left:1px solid var(--line);padding:31px 26px;overflow:auto}.portrait{width:100%;aspect-ratio:5/6;display:block;object-fit:cover;border-radius:10px}.companion h2{font-size:38px;font-weight:normal;color:var(--forest);margin:23px 0 4px}.companion p{font-size:20px;color:var(--muted);line-height:1.5;margin:0}.style-panel{border-top:1px solid var(--line);margin-top:25px;padding-top:31px}.style-panel h3{font-size:20px;font-weight:normal;margin:0 0 18px}.styles{display:flex;gap:18px}.styles button{border:1px solid var(--line);border-radius:18px;flex:1;padding:10px 12px;font-size:18px}.styles button[aria-pressed=true]{border-color:var(--forest);background:var(--soft);color:var(--forest)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}body[data-style=journal] .message.assistant{background:transparent;border-left:2px solid #8a9886;border-radius:0}body[data-style=journal] .scene-title{font-style:italic}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr) 240px}.history{padding:24px 16px}.brand{font-size:55px}.conversation{padding:26px 24px 12px}.scene-title{margin:80px 0 60px;letter-spacing:-1px}.message{font-size:19px;max-width:95%;padding:18px}.message.assistant{max-width:95%}.companion{padding:26px 18px}.companion h2{font-size:31px}.companion p,.style-panel h3{font-size:17px}.styles{gap:8px}.styles button{font-size:16px}.suggestions{gap:10px}.suggestions button{font-size:17px;padding:12px 18px}.history-item,.primary{font-size:17px}}@media(max-width:800px){.app{display:flex;flex-direction:column;height:100dvh;min-height:620px}.history{border-right:0;border-bottom:1px solid var(--line);padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:10px}.brand{font-size:36px;letter-spacing:-2px;margin:0;align-self:center}.new{font-size:14px;padding:10px 14px;width:auto}.history nav{grid-column:1/-1;border:0;margin:0;padding:0}.history h2,.demo{display:none}.history-list{display:flex;overflow-x:auto;gap:9px}.history-item{white-space:nowrap;font-size:14px;padding:9px 12px;flex-shrink:0}.companion{order:1;border:0;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;overflow:visible}.portrait{width:40px;height:48px;border-radius:7px}.bio{display:none}.style-panel{border:0;padding:0;margin:0;display:flex;align-items:center;gap:14px;flex:1}.style-panel h3{font-size:13px;margin:0;max-width:72px}.styles{flex:1}.styles button{font-size:14px;padding:8px 10px;min-height:38px}.conversation{order:2;flex:1;min-height:0;padding:16px 18px 10px}.chat-header{padding:0 0 14px}.chat-header h1{font-size:29px}.subtitle{font-size:15px}.reset{font-size:15px;padding:10px}.scene-title{font-size:33px;letter-spacing:-1px;margin:29px 0 29px;text-align:left}.message{font-size:17px;line-height:1.5;padding:15px 17px;max-width:93%;border-radius:14px}.messages{gap:15px}.suggestions{margin-top:20px;gap:8px}.suggestions button{font-size:14px;padding:11px 14px}.chat-scroll{padding-bottom:20px}.composer{padding-top:8px}.composer-row{padding:5px 7px 5px 12px;gap:8px;border-radius:12px}.composer textarea{font-size:16px;height:46px}.composer .primary{font-size:15px;padding:11px 15px;border-radius:8px}.disclosure{font-size:11px;margin:10px 0 4px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-style="quiet"><div class="app">
<aside class="history" aria-label="Conversation history"><p class="brand">Still</p><button class="primary new" id="new">New conversation</button><nav aria-label="Saved demo conversations"><h2>Today</h2><div class="history-list" id="history"></div></nav><div class="demo">Interface demo.</div></aside>
<main class="conversation"><header class="chat-header"><div><h1>Mira</h1><p class="subtitle">Your AI companion</p></div><button class="reset" id="reset">Reset</button></header><div class="chat-scroll" id="scroll"><h2 class="scene-title" id="scene-title">A little room to exhale.</h2><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div><div class="suggestions" id="suggestions"></div></div><form class="composer" id="composer"><div class="composer-row"><label for="input" class="sr-only">Write a message</label><textarea id="input" placeholder="Write a message…" rows="1" maxlength="2000"></textarea><button class="primary" id="send" type="submit">Send</button><button class="primary" id="cancel" type="button" hidden>Cancel</button></div><p class="disclosure">Demo conversation · responses are simulated<br><a href="https://moyuziya.gumroad.com/l/xfjci?utm_source=live_demo&amp;utm_medium=preview&amp;utm_campaign=still_launch" style="display:inline-block;color:var(--forest);padding:8px 4px;text-underline-offset:3px">Get the template + commercial-use license — $12</a></p></form></main>
<aside class="companion" aria-label="Companion and conversation style"><img class="portrait" src="mira.png" alt="Fictional AI companion Mira, a photographic portrait created with AI" width="320" height="384"><div class="bio"><h2>Mira</h2><p>A thoughtful space, at your pace.</p></div><section class="style-panel"><h3>Conversation style</h3><div class="styles" aria-label="Conversation style"><button type="button" data-style="quiet" aria-pressed="true">Quiet</button><button type="button" data-style="journal" aria-pressed="false">Journal</button></div></section></aside>
</div>
<script>
const $=id=>document.getElementById(id);
const seeds={evening:{name:'A slower evening',messages:[['user','Today felt a little too full.'],['assistant','We can take it one piece at a time. Would you rather talk it through, or find a small way to unwind?']]},weekend:{name:'Ideas for the weekend',messages:[['user','I want a weekend that feels like a pause.'],['assistant','What would feel restorative: a little time outdoors, making something, or leaving a morning unplanned?']]}};
let conversations=Object.fromEntries(Object.entries(seeds).map(([k,v])=>[k,{name:v.name,messages:v.messages.map(x=>[...x])}]));let current='evening',style='quiet',pending=null,newCount=0;
function render(){const history=$('history');history.replaceChildren();for(const [id,c]of Object.entries(conversations)){const b=document.createElement('button');b.className='history-item';b.textContent=c.name;b.setAttribute('aria-current',String(id===current));b.onclick=()=>{cancel();current=id;render()};history.append(b)}$('messages').replaceChildren();for(const [role,text]of conversations[current].messages){const p=document.createElement('div');p.className='message '+role;p.textContent=text;$('messages').append(p)}$('scene-title').textContent=style==='journal'?'A page for what’s on your mind.':'A little room to exhale.';$('suggestions').replaceChildren();const suggestions=style==='quiet'?['Talk it through','Help me unwind']:['One thing I noticed','A moment worth keeping'];for(const text of suggestions){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>send(text);$('suggestions').append(b)}document.body.dataset.style=style;document.querySelectorAll('[data-style][type=button]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===style)))}
function busy(value){$('send').hidden=value;$('cancel').hidden=!value;$('input').readOnly=value;$('suggestions').querySelectorAll('button').forEach(b=>b.disabled=value)}
function cancel(){if(pending!==null){clearTimeout(pending);pending=null;$('messages').querySelector('.pending')?.remove();busy(false)}}
function send(text){if(pending!==null)return;const value=text.trim();if(!value)return;conversations[current].messages.push(['user',value]);$('input').value='';render();busy(true);const p=document.createElement('div');p.className='message assistant pending';p.textContent='Mira is composing…';$('messages').append(p);$('scroll').scrollTop=$('scroll').scrollHeight;const id=current,mode=style;pending=setTimeout(()=>{pending=null;const answer=mode==='journal'?'Let’s give that a little space on the page. What happened, how did it feel, and what would you like to carry forward?':/unwind|rest|pause/i.test(value)?'Try setting one small thing aside for a moment. A glass of water, an open window, or a few quiet breaths can be a gentle place to begin.':'We can slow this down together. What part would you like to put into words first?';conversations[id].messages.push(['assistant',answer]);render();busy(false);$('scroll').scrollTop=$('scroll').scrollHeight;$('input').focus()},1400)}
$('composer').onsubmit=e=>{e.preventDefault();send($('input').value)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('input').value)}};$('cancel').onclick=()=>{cancel();$('input').focus()};$('reset').onclick=()=>{cancel();conversations[current].messages=seeds[current]?seeds[current].messages.map(x=>[...x]):[];render();$('input').value='';$('input').focus()};$('new').onclick=()=>{cancel();current='new'+(++newCount);conversations[current]={name:'New conversation '+newCount,messages:[]};render();$('input').value='';$('input').focus()};document.querySelectorAll('[data-style][type=button]').forEach(b=>b.onclick=()=>{cancel();style=b.dataset.style;render()});render();
</script></body></html>
